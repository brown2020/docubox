name: CI
on:
  push:
    branches: [dev, main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Public Firebase client config required at Next.js import/build time.
      NEXT_PUBLIC_FIREBASE_APIKEY: "REDACTED_BY_HISTORY_PURGE"
      NEXT_PUBLIC_FIREBASE_AUTHDOMAIN: "docboxproject.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECTID: "docboxproject"
      NEXT_PUBLIC_FIREBASE_STORAGEBUCKET: "docboxproject.appspot.com"
      NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID: "154491259929"
      NEXT_PUBLIC_FIREBASE_APPID: "1:154491259929:web:a0aa1e574dbd40b0b96e88"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke production server /api/health
        run: |
          set -euo pipefail
          npm run start -- --port 3000 > /tmp/next-start.log 2>&1 &
          pid=$!
          cleanup() { kill "$pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 45); do
            if curl -fsS "http://127.0.0.1:3000/api/health" -o /tmp/health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/health.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/health.json"))
          print(json.dumps(data, indent=2))
          if data.get("ok") is not True or data.get("service") != "docubox":
              sys.exit("health smoke failed")
          if not data.get("checks", {}).get("firebase_public"):
              sys.exit("firebase_public check false")
          PY
